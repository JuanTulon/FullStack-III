spring.application.name=mascotas

# --- Configuración MySQL (XAMPP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/mascotas_db

# Credenciales por defecto de XAMPP
spring.datasource.username=root
spring.datasource.password=

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Driver y Dialecto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Comportamiento de Hibernate
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=36000000
frontend.url=http://localhost:8090

# Limites para la subida de archivos (Fotos de reportes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB