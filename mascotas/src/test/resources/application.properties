# 1. Usar base de datos H2 en memoria exclusivamente para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Forzar a Hibernate a crear las tablas desde cero al inicio y borrarlas al final
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 3. Mostrar el SQL en consola para ver cómo crea las tablas (opcional pero útil)
spring.jpa.show-sql=true