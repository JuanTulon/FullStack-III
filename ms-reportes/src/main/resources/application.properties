spring.application.name=ms-reportes
server.port=8083

# --- Configuración PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_reportes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Driver y Dialecto
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Comportamiento de Hibernate
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=36000000
frontend.url=http://localhost:8090

# Limites para la subida de archivos (Fotos de reportes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB